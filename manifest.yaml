name: polym-customer-prospect
version: 0.1.0
stage: beta
owners:
  - SA Team

description_for_install: |
  Customer prospection and profiling for pre-meeting preparation.
  Given a company name, URL, and/or contact person (none required as
  a hard blocker), gathers multi-source intelligence:
    • Apollo.io organization + people enrichment
    • Company website + domain web scraping
    • Web search: AI news, LinkedIn, funding, MAU, competitor signals
  Synthesizes a comprehensive Lark prospection document covering
  company overview, AI/ML stack (including third-party resellers),
  vertical analysis, competitive landscape, BytePlus opportunity
  assessment (text / image / video / audio models), and tailored AE + SA
  meeting questions.

depends_on:
  binaries:
    - lark-cli: ">=1.0.85"   # v2 docs API required; v1 interface is shut down
  env:
    - APOLLO_API_KEY: "Apollo.io API key (recommended — Agent A is skipped if unset/invalid; the run still completes)"
    - PROSPECTS_FOLDER_TOKEN: "Lark folder token for prospection docs (optional)"

io_contract:
  reads:
    - web: company website, LinkedIn public pages, news, Crunchbase
    - apollo: organization enrichment, people/contacts search
  writes:
    - lark_doc: standalone prospection Lark document (always)

triggers:
  - "customer prospect"
  - "prospect this company"
  - "prepare for customer meeting"
  - "customer profile"
  - "pre-meeting research"
  - "company research"
  - "公司调研"
  - "客户调研"
  - "帮我准备客户会议"
  - "做个客户画像"
  - "客户prospect"
  - "会前准备"
  - "帮我查一下这个公司"

deprecates: []
